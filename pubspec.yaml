name: page_crealo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  breakify:
    git:
      url: https://github.com/josueSerna/breakify.git
      ref: v0.3.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  simple_icons: ^16.23.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
  assets:
    - assets/images/crealo_profile.jpeg
    - assets/images/logos/logo_min.svg
    - assets/images/logos/logo_max.svg

